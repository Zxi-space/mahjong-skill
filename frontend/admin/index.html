<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>雀变 · 管理后台</title><script>(function(){try{var p=localStorage.getItem('mahjong-skill-theme');if(p!=='dark'&&p!=='system')p='light';var dark=p==='dark'||(p==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-qb-theme',dark?'dark':'light')}catch(e){document.documentElement.setAttribute('data-qb-theme','light')}})();</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
